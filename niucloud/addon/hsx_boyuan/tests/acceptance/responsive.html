<head><meta charset="UTF-8"><title>博远移动端窄屏验收</title><style>body{margin:0;background:#e9edf1;font:14px system-ui,sans-serif;color:#26323e}header{padding:12px 18px;display:flex;align-items:center;gap:14px}select{font:inherit;padding:6px;border:1px solid #ccd3dd;background:white}iframe{display:block;margin:0 auto;border:1px solid #cbd3dd;max-width:100%;background:white}a{color:#245fbe}</style></head>
